<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amonestacion</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="pantalla-amonestacion">
        <div class="encabezado1-iconos">
                <h1>Amonestacion</h1>
                <img src="imgs/logo2.png" alt="Insignia de torneo" class="logo-playpokemon">
                <div class="horizontal">
                    <br><br><br>
                    <h2>Aitor Amigot</h2>
            <img src="imgs/pikachu.png" alt="pikachu" class="encabezado1-pikachu">
                </div>
        </div>
        <section class="amonestacion">   
            <div class="tipo-torneo">
                <label>Tipo</label> 
                <select>
                    <option>Leve</option>
                    <option>Grave</option>
                    <option>Expulsión</option>
                </select>
            </div>
            <div class="texts-amonestacion">
                <label>Obsersación</label> 
                <textarea class="text-amonestacion"></textarea>
            </div>
            <div class="texts-amonestacion">
                <label>Decisión</label> 
                <textarea class="text-amonestacion" required></textarea>
            </div>
        </section>
    </main>
</body>
</html>
